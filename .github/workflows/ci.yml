name: CI

on: [push, pull_request]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - run: python3 -m py_compile workflow.py app.py
      - run: python3 workflow.py --topic "lead generation" --audience "small cafes"
      - run: docker build -t multi-agent-workflow .